<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Phantom Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try { var t = localStorage.getItem('pm.theme') || 'light';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <div class="brand-name">Phantom Monitor</div>
            <div class="brand-sub">field device &amp; geofence ops</div>
          </div>
        </div>
        <h1>Sign in</h1>
        <p class="sub">This console reads the Ekos client-state store. Enter the dashboard password to continue.</p>
        <form id="login-form">
          <input
            id="password"
            type="password"
            placeholder="Dashboard password"
            autocomplete="current-password"
            autofocus
            required
          />
          <div class="login-error" id="error"></div>
          <button class="btn btn-primary" type="submit" id="submit">Sign in</button>
        </form>
      </div>
    </div>

    <script>
      const form = document.querySelector('#login-form');
      const errorBox = document.querySelector('#error');
      const submit = document.querySelector('#submit');

      function nextUrl() {
        const params = new URLSearchParams(location.search);
        const next = params.get('next');
        // Only allow same-origin relative paths back.
        if (next && next.startsWith('/') && !next.startsWith('//')) return next;
        return '/index.html';
      }

      // With no password configured there is nothing to ask for - go straight in.
      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then((res) => res.json())
        .then((me) => {
          if (me.authRequired === false) location.replace(nextUrl());
        })
        .catch(() => {});

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        submit.disabled = true;
        submit.textContent = 'Checking...';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ password: document.querySelector('#password').value }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || 'Sign in failed');
          location.href = nextUrl();
        } catch (err) {
          errorBox.textContent = err.message;
          submit.disabled = false;
          submit.textContent = 'Sign in';
        }
      });
    </script>
  </body>
</html>
